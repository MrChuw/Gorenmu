services:
  Gorenmu_db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_LOGIN}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: always

  Gorenmu_cache:
    image: valkey/valkey:unstable
    volumes:
      - ./.redis_data:/data
    ports:
      - "6379:6379"
    command: "valkey-server --save 60 1 --loglevel warning"
    restart: always

  Gorenmu_bot:
    image: python:3.12.6
    working_dir: /app
    network_mode: host
    command: >
      /bin/bash -c "pip install -q -r requirements.txt && python __main__.py"
    volumes:
      - .:/app
    depends_on:
      - Gorenmu_db
      - Gorenmu_cache
    restart: always


  js-apis:
    image: oven/bun:slim
    working_dir: /app
    volumes:
      - ./bot/apis/js_apis:/code
    ports:
      - "12843:3000"
    command: >
      sh /code/start.sh
