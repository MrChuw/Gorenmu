version: '3'
services:
  Gorenmu_db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_LOGIN}
      MYSQL_PASSWORD: ${DB_PASSWORD}
#      TZ: America/Fortaleza
    volumes:
      - ./.db_data:/var/lib/mysql
    ports:
      - 3307:3306
    networks:
      - grafana-prometheus_monitor-net
    restart: always

  Gorenmu_cache:
    image: valkey/valkey:unstable
#    environment:
#      TZ: America/Fortaleza
    volumes:
      - ./.redis_data:/data
    ports:
      - 6379:6379
    networks:
      - grafana-prometheus_monitor-net
    command: "valkey-server --save 60 1 --loglevel warning"
    restart: always

  Gorenmu_bot:
    image: python:3.10
    working_dir: /app
    network_mode: host
#    environment:
#      TZ: America/Fortaleza
    command: >
      /bin/bash -c "pip install -q -r requirements.txt && python __main__.py"
    volumes:
      - .:/app
    depends_on:
      - Gorenmu_db
      - Gorenmu_cache
    restart: always

networks:
  grafana-prometheus_monitor-net:
    external: true




