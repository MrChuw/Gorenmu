
[tool.black]
line-length = 120  # Comprimento máximo das linhas
target-version = ['py39', 'py310', 'py311']  # Versões target do Python
include = '\.pyi?$'  # Padrão para incluir arquivos
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | models/__init__\.py
)/
'''  # Padrão para excluir arquivos e diretórios
skip-string-normalization = false  # Não normaliza aspas (para True, ignora normalização)
skip-magic-trailing-comma = true  # Não pula a vírgula mágica
preview = false  # Usar recursos experimentais do Black


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: tests that make real requests", "template: just the template for the test."]
addopts = "-m 'not network' -m 'not template'"

