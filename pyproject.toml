
[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | models/__init__\.py
)/
'''
skip-string-normalization = false
skip-magic-trailing-comma = true

[tool.flake8]
ignore = ["E203", "W503"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["network: tests that make real requests", "template: just the template for the test.",
    "pt_BR: Test for Portuguse language.", "en: Test for English language."]
#addopts = "-m 'not template'"
#addopts = "-n auto -m 'not template'"
addopts = "-m 'not network and not template'"
#addopts = "-n auto -m 'not network and not template'"


